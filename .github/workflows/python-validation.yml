name: Python validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile application
        run: python -m compileall -q app
      - name: Run analysis tests
        run: python -m unittest discover -s tests -v
      - name: Import FastAPI application
        run: python -c "from app.main import app; print(app.title)"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check dashboard JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path("static/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script\\b[^>]*>(.*?)</script>", html, re.S)
          inline = [script for script in scripts if script.strip()]
          if not inline:
              raise SystemExit("No inline dashboard script found")
          Path("/tmp/dashboard.js").write_text("\\n".join(inline), encoding="utf-8")
          PY
          node --check /tmp/dashboard.js
